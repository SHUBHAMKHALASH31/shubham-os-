<title>Shubham OS — Special Features (Full Guide)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07070d;color:#f3e9d2;font-family:Georgia,'Times New Roman',serif;overflow:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(1000px 600px at 15% -10%,rgba(212,175,55,.22),transparent 60%),radial-gradient(900px 500px at 90% 110%,rgba(212,175,55,.14),transparent 60%),#07070d;z-index:0}
.shield{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:62vh;color:rgba(212,175,55,.05);z-index:0;pointer-events:none}
#lang{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:5;padding:20px;text-align:center}
#lang h1{font-size:clamp(30px,6vw,54px);color:#d4af37;letter-spacing:1px}
#lang p{color:#cbbd93;font-size:clamp(15px,2.4vw,20px)}
.lbtns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.lbtn{background:linear-gradient(180deg,#1c1a12,#12100a);border:1px solid #d4af37;color:#f3e9d2;padding:14px 26px;border-radius:12px;font-size:19px;cursor:pointer;font-family:inherit;transition:.2s}
.lbtn:hover{background:#d4af37;color:#12100a;transform:translateY(-2px)}
#deck{position:fixed;inset:0;display:none;z-index:2}
.slide{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:6vh 7vw;text-align:center;animation:fade .45s ease}
.slide.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.slide h2{font-size:clamp(26px,5vw,46px);color:#d4af37;margin-bottom:22px}
.lines{max-width:880px}
.lines p{font-size:clamp(16px,2.6vw,24px);line-height:1.55;color:#f3e9d2;margin:9px 0;text-align:left}
.cmd{margin-top:24px;background:#0d0c08;border:1px solid #d4af37;border-radius:10px;padding:12px 22px;font-family:'Courier New',monospace;font-size:clamp(15px,2.4vw,22px);color:#ffd968}
.note{margin-top:18px;max-width:820px;color:#cbbd93;font-size:clamp(14px,2.1vw,19px);font-style:italic;line-height:1.5}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;z-index:6;background:linear-gradient(0deg,rgba(7,7,13,.92),transparent)}
.nbtn{background:#1c1a12;border:1px solid #d4af37;color:#f3e9d2;border-radius:10px;padding:10px 20px;font-size:17px;cursor:pointer;font-family:inherit}
.nbtn:hover{background:#d4af37;color:#12100a}
.nbtn:disabled{opacity:.3;cursor:default}
#count{color:#cbbd93;font-size:16px}
#dots{position:fixed;top:14px;left:0;right:0;display:flex;gap:5px;justify-content:center;flex-wrap:wrap;padding:0 12px;z-index:6}
#dots i{width:8px;height:8px;border-radius:50%;background:rgba(212,175,55,.3);display:block}
#dots i.on{background:#d4af37}
#lchange{position:fixed;top:38px;right:16px;z-index:7;background:transparent;border:1px solid rgba(212,175,55,.5);color:#cbbd93;border-radius:8px;padding:5px 12px;cursor:pointer;font-family:inherit;font-size:14px}
</style>
</head>

<div class="bg"></div><div class="shield">&#128737;</div>

<p>Special Features — the full guide, step by step. Choose your language.</p>

</div>

<script>
const S = {"en": [{"t": "Welcome to Shubham OS", "c": "", "b": ["The power of Kali, the ease of a home PC — in one system.", "Made by Shubham, for the whole world.", "This presentation explains every Special Feature — from the first click to the last step."], "n": ""}, {"t": "What are Special Features?", "c": "shubham-help", "b": ["17 special tools that no other OS gives in one click.", "Every tool lives in one place — the menu section: Shubham OS Special Features.", "Every tool also has a short terminal command.", "Type the command below in a terminal to see all commands in one list."], "n": ""}, {"t": "Two ways to use every feature", "c": "", "b": ["Way 1 — Menu: open Shubham OS Special Features and click the feature. No typing.", "Way 2 — Terminal: type the feature command, like shubham-netfix.", "Both ways do exactly the same work."], "n": ""}, {"t": "1. Net Fix", "c": "shubham-netfix", "b": ["Internet stopped working? Net Fix finds the problem and fixes it in one click.", "It restarts the network, clears old settings and tests the connection for you."], "n": ""}, {"t": "Net Fix — How to use", "c": "shubham-netfix", "b": ["Step 1: Open the menu, go to Shubham OS Special Features, and click Net Fix. (Or type the command below in the terminal.)", "Step 2: The tool checks your connection.", "Step 3: It restarts the network and clears the old DNS settings.", "Step 4: It tests the internet by itself.", "Step 5: Read the result — Internet is working, or what is still wrong."], "n": ""}, {"t": "2. History File", "c": "shubham-history", "b": ["Every command you ever typed in the terminal — from the first to the last — saved in one text file.", "Best for class notes, practice records and revision."], "n": ""}, {"t": "History File — How to use", "c": "shubham-history", "b": ["Step 1: Type the command below in the terminal.", "Step 2: It asks — where to save? Type a place, or just press Enter for the Desktop.", "Step 3: A file is made with all your commands, in order.", "Step 4: Open the file any time — your full command history is in it."], "n": ""}, {"t": "3. Google Chrome", "c": "", "b": ["Google Chrome comes ready with Shubham OS — no download, no install.", "Kali gives only Firefox. Shubham OS gives you both — Chrome and Firefox."], "n": ""}, {"t": "Google Chrome — How to use", "c": "", "b": ["Step 1: Open the Apps menu.", "Step 2: Click Google Chrome.", "Step 3: Sign in with your Google account, if you want.", "Step 4: Done — browse like on any normal PC."], "n": ""}, {"t": "4. Phone Connect", "c": "shubham-phone", "b": ["Connect your phone with your PC — send files both ways, no cable needed.", "Photos, videos, documents — pick and send."], "n": ""}, {"t": "Phone Connect — How to use", "c": "shubham-phone", "b": ["Step 1: Type the command below, or click Phone Connect in the menu.", "Step 2: An address and a code appear on the PC screen.", "Step 3: Open that address on your phone and type the code.", "Step 4: Phone and PC are connected.", "Step 5: Choose a file on either side and press Send."], "n": ""}, {"t": "5. Data Locker", "c": "shubham-locker", "b": ["Lock any file or folder with your own password.", "Without the password, nobody can open it — the file stays hidden and safe."], "n": ""}, {"t": "Data Locker — How to use", "c": "shubham-locker", "b": ["Step 1: First time only — set your locker password.", "Step 2: Choose the file or folder to lock.", "Step 3: Press Lock — it goes inside the locker and disappears from its place.", "Step 4: To open it again — run the command, give the password, choose Unlock."], "n": ""}, {"t": "6. Screen Record", "c": "shubham-record", "b": ["Record your whole screen as a video.", "Made for classes, demos, tutorials and proof of work."], "n": ""}, {"t": "Screen Record — How to use", "c": "shubham-record", "b": ["Step 1: Click Screen Record in the menu, or type the command below.", "Step 2: Recording starts — a red dot on the screen shows it is ON.", "Step 3: Do your work on the PC.", "Step 4: Click again to stop.", "Step 5: Your video is saved in the Videos folder."], "n": ""}, {"t": "7. Guest Mode", "c": "shubham-guest", "b": ["Someone else wants to use your PC? Give them Guest Mode.", "They get a clean, empty PC. Your files stay hidden and safe."], "n": ""}, {"t": "Guest Mode — How to use", "c": "shubham-guest", "b": ["Step 1: Click Guest Mode and press OK.", "Step 2: The PC restarts into a guest account.", "Step 3: The guest can work freely — nothing they do is saved.", "Step 4: When they log out, log in with your own account — everything is as it was."], "n": ""}, {"t": "8. Speed Up PC", "c": "shubham-clean", "b": ["PC feeling slow? This cleans the junk — old temp files, cache and useless logs.", "More free space, a lighter PC."], "n": ""}, {"t": "Speed Up PC — How to use", "c": "shubham-clean", "b": ["Step 1: Click Speed Up PC.", "Step 2: It shows how much junk it found.", "Step 3: Press Clean.", "Step 4: It shows how much space was freed."], "n": ""}, {"t": "9. WiFi Password", "c": "shubham-wifi", "b": ["Forgot a WiFi password? See every WiFi password saved on this PC.", "No need to open the router page or ask anyone."], "n": ""}, {"t": "WiFi Password — How to use", "c": "shubham-wifi", "b": ["Step 1: Click WiFi Password.", "Step 2: Type your PC password — this is for your safety.", "Step 3: A list of saved WiFi networks opens.", "Step 4: Click a network — its password is shown."], "n": ""}, {"t": "10. File Recovery", "c": "shubham-recover", "b": ["Deleted a file by mistake? Do not worry.", "Deleted files stay in a hidden backup for 7 days."], "n": ""}, {"t": "File Recovery — How to use", "c": "shubham-recover", "b": ["Step 1: Click File Recovery.", "Step 2: A list of your deleted files opens.", "Step 3: Choose the file you want back.", "Step 4: Press Restore — the file returns to its old place."], "n": "After 7 days, old backups are cleaned by themselves."}, {"t": "11. Error Guide", "c": "shubham-error", "b": ["A red error on the screen? Error Guide explains it in simple words — and tells you the fix.", "It speaks your language."], "n": ""}, {"t": "Error Guide — How to use", "c": "shubham-error hindi", "b": ["Step 1: Type the command and write your error words — or pick from the common errors list.", "Step 2: Read the meaning in simple words.", "Step 3: Follow the fix, step by step.", "Step 4: For another language, add the language after the command — like the example below."], "n": "A fully new error gives a helpful hint, not a full answer. The default language is English."}, {"t": "12. Practice Lab", "c": "shubham-lab", "b": ["A safe ground to practise hacking commands — the heart of Shubham OS.", "Every command here is an ORIGINAL Kali command. Nothing is fake.", "The lab is a closed network — your practice never touches the outside world."], "n": ""}, {"t": "Practice Lab — How to use", "c": "shubham-lab", "b": ["Step 1: Type the command below, or click Practice Lab in the menu.", "Step 2: Choose — New Lab, Saved Lab, or Reset.", "Step 3: Practice goes step by step — basic commands first, then the big lab targets.", "Step 4: Save your lab and continue tomorrow from the same place."], "n": ""}, {"t": "Practice Lab — Your own notes", "c": "shubham-lab", "b": ["You can import your own notes file and practise from it.", "The first time, the format and rules are shown once — read them.", "A free Sample Notes file shows exactly how to set your commands.", "Only notes made in that format can be imported."], "n": ""}, {"t": "13. Live Screen", "c": "shubham-live", "b": ["Show your PC screen to any person on the internet — live.", "They can only watch. They cannot click or change anything."], "n": ""}, {"t": "Live Screen — How to use", "c": "shubham-live", "b": ["Step 1: Click Live Screen.", "Step 2: A warning appears — read it, then press Start.", "Step 3: A link and a code appear on your screen.", "Step 4: Send the link and code to the person — they open it in any browser.", "Step 5: Press Stop any time — sharing ends at once."], "n": "Both sides need internet for Live Screen."}, {"t": "14. Net Speed", "c": "shubham-speed", "b": ["Check your internet speed in one click.", "Download and upload — in simple numbers."], "n": ""}, {"t": "Net Speed — How to use", "c": "shubham-speed", "b": ["Step 1: Click Net Speed.", "Step 2: Wait a few seconds while it tests.", "Step 3: See your download and upload speed."], "n": ""}, {"t": "15. Carry My OS", "c": "shubham-carry", "b": ["Your whole system in a pen drive — your tools, your settings, your work.", "Plug it into any PC and boot from it — your own Shubham OS opens."], "n": ""}, {"t": "Carry My OS — How to use", "c": "shubham-carry", "b": ["Step 1: Put a pen drive in the PC. Nothing starts by itself.", "Step 2: Run the command below.", "Step 3: Read the warning — the pen drive old data will be erased. Press Yes.", "Step 4: The system copies into the pen drive (about 20 to 40 minutes).", "Step 5: On any other PC — restart it, press the boot key (F12, Esc or F8), and choose the pen drive."], "n": "The pen drive keeps two parts — one for the OS, one for your normal files."}, {"t": "16. PC Doctor", "c": "shubham-doctor", "b": ["One click checks the whole PC — disk health, virus, broken settings and slow start.", "It fixes what it can, and tells you the rest in simple words."], "n": ""}, {"t": "PC Doctor — How to use", "c": "shubham-doctor", "b": ["Step 1: Click PC Doctor.", "Step 2: It checks everything, one by one.", "Step 3: It fixes the problems it finds.", "Step 4: Read the report — what was wrong, and what is fixed."], "n": ""}, {"t": "17. Ghost Mode", "c": "shubham-ghost", "b": ["One click makes your PC a ghost — a new identity, and the net takes the hidden way.", "One click brings everything back to normal."], "n": ""}, {"t": "Ghost Mode — How to use", "c": "shubham-ghost", "b": ["Step 1: Click Ghost Mode to turn it ON.", "Step 2: Your MAC address and PC name change, and your net traffic goes by the hidden route (Tor).", "Step 3: Work as normal — the screen always shows that Ghost Mode is ON.", "Step 4: Click OFF — your old identity and direct net come back."], "n": "The net is a little slow in Ghost Mode. Your internet company can see that you are online — not what you are doing. Some bank sites may block the hidden route."}, {"t": "All Commands — Part 1", "c": "", "b": ["shubham-help — see all commands", "shubham-netfix — fix the internet", "shubham-history — save terminal history in a file", "shubham-phone — connect phone and PC", "shubham-locker — lock files with a password", "shubham-record — record the screen", "shubham-guest — guest account for others", "shubham-clean — clean junk, speed up PC", "shubham-wifi — see saved WiFi passwords"], "n": ""}, {"t": "All Commands — Part 2", "c": "", "b": ["shubham-recover — bring back deleted files", "shubham-error — understand any error", "shubham-lab — open the Practice Lab", "shubham-live — show your screen live", "shubham-speed — test internet speed", "shubham-carry — take your OS in a pen drive", "shubham-doctor — full PC check and repair", "shubham-ghost — hide your identity on the net", "Type any command in the terminal and press Enter."], "n": ""}, {"t": "Shubham OS", "c": "", "b": ["17 Special Features. One system.", "Download Shubham OS from this page and try every feature yourself.", "Made by Shubham."], "n": ""}], "hi": [{"t": "Shubham OS में आपका स्वागत है", "c": "", "b": ["Kali की ताकत और घर के PC की आसानी — एक ही system में।", "Shubham द्वारा बनाया गया, पूरी दुनिया के लिए।", "यह presentation हर Special Feature को समझाती है — पहले click से लेकर आखिरी step तक।"], "n": ""}, {"t": "Special Features क्या हैं?", "c": "shubham-help", "b": ["17 खास tools जो कोई और OS एक click में नहीं देता।", "हर tool एक ही जगह मिलता है — menu के हिस्से में: Shubham OS Special Features।", "हर tool का एक छोटा terminal command भी है।", "सभी commands एक साथ देखने के लिए terminal में नीचे वाला command लिखो।"], "n": ""}, {"t": "हर feature को चलाने के दो तरीक ા PC ની તપાસ — disk ની તંદુરસ્તી, virus, તૂટેલી settings અને slow ચાલુ થવું.", "જે ઠીક થઈ શકે તે ઠીક કરે છે, બાકીનું સરળ શબ્દોમાં કહે છે."], "n": ""}, {"t": "PC Doctor — કેવી રીતે ચલાવવું", "c": "shubham-doctor", "b": ["Step 1: PC Doctor પર click કરો.", "Step 2: તે એક-એક કરીને બધું તપાસે છે.", "Step 3: જે તકલીફો મળે તેને ઠીક કરે છે.", "Step 4: Report વાંચો — શું ખરાબ હતું અને શું ઠીક થયું."], "n": ""}, {"t": "17. Ghost Mode", "c": "shubham-ghost", "b": ["એક click માં તમારો PC ભૂત બની જાય છે — નવી ઓળખ, અને net છુપા રસ્તે જાય છે.", "એક click માં બધું પાછું સામાન્ય હાલતમાં."], "n": ""}, {"t": "Ghost Mode — કેવી રીતે ચલાવવું", "c": "shubham-ghost", "b": ["Step 1: Ghost Mode ON કરવા click કરો.", "Step 2: તમારો MAC address અને PC નું નામ બદલાઈ જશે, અને net છુપા રસ્તે (Tor) જશે.", "Step 3: સામાન્ય રીતે કામ કરો — screen પર હંમેશા દેખાશે કે Ghost Mode ON છે.", "Step 4: OFF પર click કરો — જૂની ઓળખ અને સીધો net પાછો."], "n": "Ghost Mode માં net થોડો slow રહે છે. તમારી internet company જોઈ શકે છે કે તમે online છો — એ નહીં કે તમે શું કરો છો. કેટલીક bank sites છુપો રસ્તો રોકી શકે છે."}, {"t": "બધા Commands — ભાગ 1", "c": "", "b": ["shubham-help — બધા commands જુઓ", "shubham-netfix — internet ઠીક કરો", "shubham-history — terminal history file માં save કરો", "shubham-phone — phone અને PC જોડો", "shubham-locker — files ને password થી બંધ કરો", "shubham-record — screen record કરો", "shubham-guest — બીજા માટે guest account", "shubham-clean — કચરો સાફ કરો, PC ઝડપી કરો", "shubham-wifi — save WiFi passwords જુઓ"], "n": ""}, {"t": "બધા Commands — ભાગ 2", "c": "", "b": ["shubham-recover — delete થયેલી files પાછી લાવો", "shubham-error — કોઈ પણ error સમજો", "shubham-lab — Practice Lab ખોલો", "shubham-live — તમારી screen live બતાવો", "shubham-speed — internet speed test કરો", "shubham-carry — તમારો OS pen drive માં લઈ જાઓ", "shubham-doctor — આખા PC ની તપાસ અને મરામત", "shubham-ghost — net પર તમારી ઓળખ છુપાવો", "કોઈ પણ command terminal માં લખીને Enter દબાવો."], "n": ""}, {"t": "Shubham OS", "c": "", "b": ["17 Special Features. એક system.", "આ જ page પરથી Shubham OS download કરો અને દરેક feature જાતે ચલાવીને જુઓ.", "Shubham દ્વારા બનાવેલ."], "n": ""}], "es": [{"t": "Bienvenido a Shubham OS", "c": "", "b": ["La potencia de Kali, la facilidad de un PC de casa — en un solo sistema.", "Creado por Shubham, para todo el mundo.", "Esta presentación explica cada Función Especial — desde el primer clic hasta el último paso."], "n": ""}, {"t": "¿Qué son las Funciones Especiales?", "c": "shubham-help", "b": ["17 herramientas especiales que ningún otro sistema da con un solo clic.", "Cada herramienta está en un solo lugar — la sección del menú: Shubham OS Special Features.", "Cada herramienta también tiene un comando corto de terminal.", "Escribe el comando de abajo en una terminal para ver todos los comandos en una lista."], "n": ""}, {"t": "Dos formas de usar cada función", "c": "", "b": ["Forma 1 — Menú: abre Shubham OS Special Features y haz clic en la función. Sin escribir nada.", "Forma 2 — Terminal: escribe el comando de la función, como shubham-netfix.", "Las dos formas hacen exactamente el mismo trabajo."], "n": ""}, {"t": "1. Net Fix", "c": "shubham-netfix", "b": ["¿Se cortó internet? Net Fix encuentra el problema y lo arregla con un clic.", "Reinicia la red, limpia los ajustes viejos y prueba la conexión por ti."], "n": ""}, {"t": "Net Fix — Cómo se usa", "c": "shubham-netfix", "b": ["Paso 1: Abre el menú, entra en Shubham OS Special Features y haz clic en Net Fix. (O escribe el comando de abajo en la terminal.)", "Paso 2: La herramienta revisa tu conexión.", "Paso 3: Reinicia la red y limpia los ajustes DNS viejos.", "Paso 4: Prueba internet por sí misma.", "Paso 5: Lee el resultado — internet funciona, o qué sigue mal."], "n": ""}, {"t": "2. History File", "c": "shubham-history", "b": ["Cada comando que escribiste en la terminal — del primero al último — guardado en un archivo de texto.", "Ideal para apuntes de clase, registro de práctica y repaso."], "n": ""}, {"t": "History File — Cómo se usa", "c": "shubham-history", "b": ["Paso 1: Escribe el comando de abajo en la terminal.", "Paso 2: Pregunta dónde guardar. Escribe un lugar, o pulsa Enter para el Escritorio.", "Paso 3: Se crea un archivo con todos tus comandos, en orden.", "Paso 4: Ábrelo cuando quieras — todo tu historial de comandos está ahí."], "n": ""}, {"t": "3. Google Chrome", "c": "", "b": ["Google Chrome viene listo con Shubham OS — sin descargar, sin instalar.", "Kali trae solo Firefox. Shubham OS te da los dos — Chrome y Firefox."], "n": ""}, {"t": "Google Chrome — Cómo se usa", "c": "", "b": ["Paso 1: Abre el menú de aplicaciones.", "Paso 2: Haz clic en Google Chrome.", "Paso 3: Inicia sesión con tu cuenta de Google, si quieres.", "Paso 4: Listo — navega como en cualquier PC normal."], "n": ""}, {"t": "4. Phone Connect", "c": "shubham-phone", "b": ["Conecta tu teléfono con tu PC — envía archivos en los dos sentidos, sin cable.", "Fotos, videos, documentos — elige y envía."], "n": ""}, {"t": "Phone Connect — Cómo se usa", "c": "shubham-phone", "b": ["Paso 1: Escribe el comando de abajo, o haz clic en Phone Connect en el menú.", "Paso 2: En la pantalla del PC aparecen una dirección y un código.", "Paso 3: Abre esa dirección en tu teléfono y escribe el código.", "Paso 4: Teléfono y PC están conectados.", "Paso 5: Elige un archivo en cualquier lado y pulsa Enviar."], "n": ""}, {"t": "5. Data Locker", "c": "shubham-locker", "b": ["Bloquea cualquier archivo o carpeta con tu propia contraseña.", "Sin la contraseña, nadie puede abrirlo — el archivo queda oculto y seguro."], "n": ""}, {"t": "Data Locker — Cómo se usa", "c": "shubham-locker", "b": ["Paso 1: Solo la primera vez — crea tu contraseña del locker.", "Paso 2: Elige el archivo o carpeta que quieres bloquear.", "Paso 3: Pulsa Lock — entra en el locker y desaparece de su sitio.", "Paso 4: Para abrirlo de nuevo — ejecuta el comando, da la contraseña y elige Unlock."], "n": ""}, {"t": "6. Screen Record", "c": "shubham-record", "b": ["Graba toda tu pantalla como video.", "Hecho para clases, demostraciones, tutoriales y pruebas de trabajo."], "n": ""}, {"t": "Screen Record — Cómo se usa", "c": "shubham-record", "b": ["Paso 1: Haz clic en Screen Record en el menú, o escribe el comando de abajo.", "Paso 2: Empieza la grabación — un punto rojo en la pantalla muestra que está activa.", "Paso 3: Haz tu trabajo en el PC.", "Paso 4: Haz clic de nuevo para detener.", "Paso 5: Tu video queda guardado en la carpeta Videos."], "n": ""}, {"t": "7. Guest Mode", "c": "shubham-guest", "b": ["¿Otra persona quiere usar tu PC? Dale el Guest Mode.", "Recibe un PC limpio y vacío. Tus archivos quedan ocultos y seguros."], "n": ""}, {"t": "Guest Mode — Cómo se usa", "c": "shubham-guest", "b": ["Paso 1: Haz clic en Guest Mode y pulsa OK.", "Paso 2: El PC se reinicia en una cuenta de invitado.", "Paso 3: El invitado puede trabajar libre — nada de lo que haga se guarda.", "Paso 4: Cuando cierre sesión, entra con tu cuenta — todo está como estaba."], "n": ""}, {"t": "8. Speed Up PC", "c": "shubham-clean", "b": ["¿El PC va lento? Esto limpia la basura — archivos temporales viejos, caché y registros inútiles.", "Más espacio libre, un PC más ligero."], "n": ""}, {"t": "Speed Up PC — Cómo se usa", "c": "shubham-clean", "b": ["Paso 1: Haz clic en Speed Up PC.", "Paso 2: Muestra cuánta basura encontró.", "Paso 3: Pulsa Clean.", "Paso 4: Muestra cuánto espacio se liberó."], "n": ""}, {"t": "9. WiFi Password", "c": "shubham-wifi", "b": ["¿Olvidaste una contraseña WiFi? Mira cada contraseña WiFi guardada en este PC.", "Sin abrir la página del router ni preguntar a nadie."], "n": ""}, {"t": "WiFi Password — Cómo se usa", "c": "shubham-wifi", "b": ["Paso 1: Haz clic en WiFi Password.", "Paso 2: Escribe la contraseña de tu PC — es por tu seguridad.", "Paso 3: Se abre una lista de las redes WiFi guardadas.", "Paso 4: Haz clic en una red — se muestra su contraseña."], "n": ""}, {"t": "10. File Recovery", "c": "shubham-recover", "b": ["¿Borraste un archivo por error? No te preocupes.", "Los archivos borrados quedan en una copia oculta durante 7 días."], "n": ""}, {"t": "File Recovery — Cómo se usa", "c": "shubham-recover", "b": ["Paso 1: Haz clic en File Recovery.", "Paso 2: Se abre una lista de tus archivos borrados.", "Paso 3: Elige el archivo que quieres recuperar.", "Paso 4: Pulsa Restore — el archivo vuelve a su sitio."], "n": "Después de 7 días, las copias viejas se limpian solas."}, {"t": "11. Error Guide", "c": "shubham-error", "b": ["¿Un error rojo en la pantalla? Error Guide lo explica en palabras simples — y te dice la solución.", "Habla tu idioma."], "n": ""}, {"t": "Error Guide — Cómo se usa", "c": "shubham-error hindi", "b": ["Paso 1: Escribe el comando y las palabras de tu error — o elige de la lista de errores comunes.", "Paso 2: Lee el significado en palabras simples.", "Paso 3: Sigue la solución, paso a paso.", "Paso 4: Para otro idioma, añade el idioma tras el comando — como en el ejemplo de abajo."], "n": "Un error totalmente nuevo da una pista útil, no una respuesta completa. El idioma por defecto es el inglés."}, {"t": "12. Practice Lab", "c": "shubham-lab", "b": ["Un terreno seguro para practicar comandos de hacking — el corazón de Shubham OS.", "Cada comando aquí es un comando ORIGINAL de Kali. Nada es falso.", "El laboratorio es una red cerrada — tu práctica nunca toca el mundo exterior."], "n": ""}, {"t": "Practice Lab — Cómo se usa", "c": "shubham-lab", "b": ["Paso 1: Escribe el comando de abajo, o haz clic en Practice Lab en el menú.", "Paso 2: Elige — New Lab, Saved Lab o Reset.", "Paso 3: La práctica va paso a paso — primero comandos básicos, luego los grandes objetivos del laboratorio.", "Paso 4: Guarda tu laboratorio y continúa mañana desde el mismo punto."], "n": ""}, {"t": "Practice Lab — Tus propias notas", "c": "shubham-lab", "b": ["Puedes importar tu archivo de notas y practicar desde él.", "La primera vez, el formato y las reglas se muestran una vez — léelos.", "Un archivo gratuito Sample Notes muestra exactamente cómo preparar tus comandos.", "Solo pueden importarse notas hechas en ese formato."], "n": ""}, {"t": "13. Live Screen", "c": "shubham-live", "b": ["Muestra la pantalla de tu PC a cualquier persona por internet — en vivo.", "Solo puede mirar. No puede hacer clic ni cambiar nada."], "n": ""}, {"t": "Live Screen — Cómo se usa", "c": "shubham-live", "b": ["Paso 1: Haz clic en Live Screen.", "Paso 2: Aparece un aviso — léelo y pulsa Start.", "Paso 3: En tu pantalla aparecen un enlace y un código.", "Paso 4: Envía el enlace y el código a la persona — lo abre en cualquier navegador.", "Paso 5: Pulsa Stop cuando quieras — se deja de compartir al instante."], "n": "Ambos lados necesitan internet para Live Screen."}, {"t": "14. Net Speed", "c": "shubham-speed", "b": ["Comprueba la velocidad de tu internet con un clic.", "Descarga y subida — en números simples."], "n": ""}, {"t": "Net Speed — Cómo se usa", "c": "shubham-speed", "b": ["Paso 1: Haz clic en Net Speed.", "Paso 2: Espera unos segundos mientras hace la prueba.", "Paso 3: Mira tu velocidad de descarga y de subida."], "n": ""}, {"t": "15. Carry My OS", "c": "shubham-carry", "b": ["Todo tu sistema en un pen drive — tus herramientas, tus ajustes, tu trabajo.", "Conéctalo a cualquier PC y arranca desde él — se abre tu propio Shubham OS."], "n": ""}, {"t": "Carry My OS — Cómo se usa", "c": "shubham-carry", "b": ["Paso 1: Conecta un pen drive al PC. Nada empieza solo.", "Paso 2: Ejecuta el comando de abajo.", "Paso 3: Lee el aviso — los datos viejos del pen drive se borrarán. Pulsa Yes.", "Paso 4: El sistema se copia en el pen drive (unos 20 a 40 minutos).", "Paso 5: En otro PC — reinícialo, pulsa la tecla de arranque (F12, Esc o F8) y elige el pen drive."], "n": "El pen drive guarda dos partes — una para el sistema, otra para tus archivos normales."}, {"t": "16. PC Doctor", "c": "shubham-doctor", "b": ["Un clic revisa todo el PC — salud del disco, virus, ajustes rotos y arranque lento.", "Arregla lo que puede, y el resto te lo dice en palabras simples."], "n": ""}, {"t": "PC Doctor — Cómo se usa", "c": "shubham-doctor", "b": ["Paso 1: Haz clic en PC Doctor.", "Paso 2: Revisa todo, uno por uno.", "Paso 3: Arregla los problemas que encuentra.", "Paso 4: Lee el informe — qué estaba mal y qué quedó arreglado."], "n": ""}, {"t": "17. Ghost Mode", "c": "shubham-ghost", "b": ["Un clic convierte tu PC en un fantasma — una identidad nueva, y la red toma el camino oculto.", "Un clic devuelve todo a la normalidad."], "n": ""}, {"t": "Ghost Mode — Cómo se usa", "c": "shubham-ghost", "b": ["Paso 1: Haz clic en Ghost Mode para activarlo.", "Paso 2: Tu dirección MAC y el nombre del PC cambian, y tu tráfico va por la ruta oculta (Tor).", "Paso 3: Trabaja con normalidad — la pantalla siempre muestra que Ghost Mode está activo.", "Paso 4: Haz clic en OFF — tu identidad anterior y la red directa vuelven."], "n": "La red va un poco lenta en Ghost Mode. Tu compañía de internet puede ver que estás en línea — no lo que haces. Algunos sitios de bancos pueden bloquear la ruta oculta."}, {"t": "Todos los comandos — Parte 1", "c": "", "b": ["shubham-help — ver todos los comandos", "shubham-netfix — arreglar internet", "shubham-history — guardar el historial en un archivo", "shubham-phone — conectar teléfono y PC", "shubham-locker — bloquear archivos con contraseña", "shubham-record — grabar la pantalla", "shubham-guest — cuenta de invitado para otros", "shubham-clean — limpiar basura, acelerar el PC", "shubham-wifi — ver contraseñas WiFi guardadas"], "n": ""}, {"t": "Todos los comandos — Parte 2", "c": "", "b": ["shubham-recover — recuperar archivos borrados", "shubham-error — entender cualquier error", "shubham-lab — abrir el Practice Lab", "shubham-live — mostrar tu pantalla en vivo", "shubham-speed — probar la velocidad de internet", "shubham-carry — llevar tu sistema en un pen drive", "shubham-doctor — revisión y reparación completa del PC", "shubham-ghost — ocultar tu identidad en la red", "Escribe cualquier comando en la terminal y pulsa Enter."], "n": ""}, {"t": "Shubham OS", "c": "", "b": ["17 Funciones Especiales. Un sistema.", "Descarga Shubham OS desde esta página y prueba cada función tú mismo.", "Creado por Shubham."], "n": ""}]};
let lang = null, idx = 0;
const $ = id => document.getElementById(id);
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function render(){
  const slides = S[lang];
  $('deck').innerHTML = slides.map(s =>
    '<section class="slide"><h2>'+esc(s.t)+'</h2><div class="lines">'+
    s.b.map(l=>'<p>'+esc(l)+'</p>').join('')+'</div>'+
    (s.c ? '<div class="cmd">$ '+esc(s.c)+'</div>' : '')+
    (s.n ? '<div class="note">'+esc(s.n)+'</div>' : '')+
    '</section>').join('') +
    '<div id="dots">'+slides.map(()=>'<i></i>').join('')+'</div>' +
    '<button id="lchange" onclick="back()">Language</button>' +
    '<div class="bar"><button class="nbtn" id="prev" onclick="go(-1)">&#8592; Prev</button><span id="count"></span><button class="nbtn" id="next" onclick="go(1)">Next &#8594;</button></div>';
  show(0);
}
function show(i){
  const slides = S[lang];
  idx = Math.max(0, Math.min(i, slides.length-1));
  document.querySelectorAll('.slide').forEach((el,j)=>el.classList.toggle('on', j===idx));
  document.querySelectorAll('#dots i').forEach((el,j)=>el.classList.toggle('on', j===idx));
  $('count').textContent = (idx+1)+' / '+slides.length;
  $('prev').disabled = idx===0; $('next').disabled = idx===slides.length-1;
}
function go(d){ show(idx+d); }
function pick(l){ lang=l; $('lang').style.display='none'; $('deck').style.display='block'; render(); }
function back(){ $('deck').style.display='none'; $('lang').style.display='flex'; }
document.addEventListener('keydown', e=>{ if(!lang) return; if(e.key==='ArrowRight') go(1); if(e.key==='ArrowLeft') go(-1); });
</script>
