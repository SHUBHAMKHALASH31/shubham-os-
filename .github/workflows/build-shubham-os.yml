name: Build Shubham OS ISO
on:
  workflow_dispatch:
  push:
    paths:
      - 'build-trigger.txt'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
      - name: Check disk space
        run: |
          df -h .
          AVAIL=$(df --output=avail -BG . | tail -1 | tr -dc '0-9')
          echo "Khali jagah: ${AVAIL} GB"
          if [ "$AVAIL" -lt 30 ]; then echo "ERROR: Jagah kam hai - build nahi ho payegi"; exit 1; fi
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools xorriso rsync curl
      - name: Download latest Kali Live ISO
        run: |
          BASE="https://cdimage.kali.org/current/"
          ISO_NAME=$(curl -s "$BASE" | grep -oE 'kali-linux-[0-9.]+-live-amd64\.iso' | head -1)
          echo "Downloading $ISO_NAME"
          curl -L -o kali-live.iso "$BASE$ISO_NAME"
          ls -lh kali-live.iso
          SIZE=$(stat -c%s kali-live.iso)
          if [ "$SIZE" -lt 3000000000 ]; then echo "ERROR: File bahut chhoti hai ($SIZE bytes) - ye ISO nahi, error page lagti hai"; exit 1; fi
          curl -s -o SHA256SUMS "$BASE/SHA256SUMS"
          grep "$ISO_NAME" SHA256SUMS | sed "s|$ISO_NAME|kali-live.iso|" | sha256sum -c - || { echo "ERROR: Checksum match nahi hua"; exit 1; }
          echo "Checksum OK - asli Kali ISO hai"
      - name: Remaster into Shubham OS
        run: |
          chmod +x remaster-shubham-os.sh
          ./remaster-shubham-os.sh "$PWD/kali-live.iso"
      - name: Split ISO and publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir parts
          split -b 1900M "$HOME/ShubhamOS-v1.iso" parts/ShubhamOS-v1.iso.part-
          PARTS=$(ls parts/ShubhamOS-v1.iso.part-* | xargs -n1 basename | paste -sd+ -)
          printf 'copy /b %s ShubhamOS.iso\r\n' "$PARTS" > parts/ShubhamOS-join.bat
          ls -lh parts/
          gh release delete "v1" --yes --cleanup-tag || true
          gh release create "v1" parts/* --title "Shubham OS v1" --notes "Shubham OS - Dual Mode. SAARE parts aur ShubhamOS-join.bat download karo, sab ek hi folder me rakho, phir join.bat par double-click karo - ShubhamOS.iso ban jayegi."
